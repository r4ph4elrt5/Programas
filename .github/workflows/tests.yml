name: Validate MultiPost

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build and retain the Windows onedir package
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
      - name: Install dependencies
        run: python -m pip install -e ".[dev,api,build]"
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest
      - name: Diagnostics
        run: python -m multipost --diagnostics
      - name: Build Windows package
        if: github.event_name == 'workflow_dispatch' && inputs.build_windows
        run: python -m PyInstaller --noconfirm multipost.spec
      - name: Packaged diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.build_windows
        shell: pwsh
        run: |
          & .\dist\MultiPost\MultiPost.exe --diagnostics
          if ($LASTEXITCODE -ne 0) { throw 'Packaged diagnostics failed' }
      - name: Retain Windows package
        if: github.event_name == 'workflow_dispatch' && inputs.build_windows
        uses: actions/upload-artifact@v4
        with:
          name: MultiPost-Windows
          path: dist/MultiPost/
          if-no-files-found: error
