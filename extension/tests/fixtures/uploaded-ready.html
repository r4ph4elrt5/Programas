<div data-e2e="upload_status_container">
  <div class="info-status success"><span data-icon="CheckCircleFill"></span><span>Enviado（100 MB）</span></div>
  <button aria-label="Substituir" aria-disabled="false" data-disabled="false">Substituir</button>
  <div class="info-progress success" style="width:100%;visibility:visible"></div>
</div>
<div class="status-wrapper">
  <div class="status-result status-ready" data-show="false">Verificaremos o conteúdo.</div>
  <div class="status-result status-checking" data-show="false">Verificação em andamento.</div>
  <div class="status-result status-error" data-show="false">Tentar novamente</div>
  <div class="status-result status-success" data-show="true">Nenhum problema encontrado.</div>
</div>
<button data-e2e="post_video_button" aria-disabled="false" data-disabled="false" data-loading="false">Agendar</button>
